<section class="final-cta section-dark">
  <div class="final-cta__glow" aria-hidden="true"></div>
  <div class="container final-cta__inner" appReveal>
    <h2 class="final-cta__heading">Have a Technology Challenge?</h2>
    <p class="final-cta__lede">Let's discuss your idea, application or technical requirement.</p>
    <div class="final-cta__actions">
      <a href="#contact" class="btn btn-light">
        Start a Conversation
        <app-icon name="arrow-right" [size]="18" />
      </a>
      <a href="#contact" class="btn btn-secondary">Request a Consultation</a>
    </div>
  </div>
</section>
